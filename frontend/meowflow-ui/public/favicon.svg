<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- 汉堡喵 MeowFlow Logo：圆面包切片 + 楔形猫耳 + 芝麻眼 + 胡须 -->
  <defs>
    <!-- 金渐层猫身毛色：金到焦糖渐变 -->
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E5C07B"/>
      <stop offset="55%" stop-color="#C19A6B"/>
      <stop offset="100%" stop-color="#8B6F47"/>
    </linearGradient>
    <!-- 外圈圆角矩形：奶白 -->
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFF8E7"/>
      <stop offset="100%" stop-color="#F5E6C8"/>
    </linearGradient>
  </defs>

  <!-- 圆角方形底板 -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bg)"/>

  <!-- 左耳 -->
  <path d="M 19 18 L 16 8 L 26 14 Z" fill="url(#fur)"/>
  <!-- 右耳 -->
  <path d="M 45 18 L 48 8 L 38 14 Z" fill="url(#fur)"/>

  <!-- 猫脸圆 -->
  <circle cx="32" cy="32" r="16" fill="url(#fur)"/>

  <!-- 鼻头 -->
  <path d="M 32 31 L 29 34 L 35 34 Z" fill="#E89AA0"/>
  <!-- 嘴 -->
  <path d="M 32 35 Q 29 38 27 36" stroke="#2C1810" stroke-width="1" fill="none" stroke-linecap="round"/>
  <path d="M 32 35 Q 35 38 37 36" stroke="#2C1810" stroke-width="1" fill="none" stroke-linecap="round"/>

  <!-- 左眼（杏核形） -->
  <ellipse cx="25" cy="28" rx="2.4" ry="3" fill="#2C1810"/>
  <!-- 右眼 -->
  <ellipse cx="39" cy="28" rx="2.4" ry="3" fill="#2C1810"/>
  <!-- 眼睛高光 -->
  <circle cx="25.8" cy="27" r="0.7" fill="#FFF"/>
  <circle cx="39.8" cy="27" r="0.7" fill="#FFF"/>

  <!-- 左胡须 -->
  <line x1="22" y1="33" x2="13" y2="31" stroke="#2C1810" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="22" y1="35" x2="13" y2="36" stroke="#2C1810" stroke-width="0.8" stroke-linecap="round"/>
  <!-- 右胡须 -->
  <line x1="42" y1="33" x2="51" y2="31" stroke="#2C1810" stroke-width="0.8" stroke-linecap="round"/>
  <line x1="42" y1="35" x2="51" y2="36" stroke="#2C1810" stroke-width="0.8" stroke-linecap="round"/>

  <!-- 头顶两粒芝麻（点缀"汉"字感） -->
  <circle cx="28" cy="18" r="0.9" fill="#5C3D1F"/>
  <circle cx="36" cy="18" r="0.9" fill="#5C3D1F"/>
</svg>
