name: Test & Coverage

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'

jobs:
  test-with-services:
    name: Backend Tests (PG + Redis + RabbitMQ + MinIO + Nacos)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: meowflow
          POSTGRES_PASSWORD: meowflow123
          POSTGRES_DB: meowflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'
          cache: 'maven'

      - name: Build (skip tests)
        run: mvn -f backend/meowflow/pom.xml clean install -DskipTests -q

      # 默认跑单元 + MockMvc（不需要任何外部服务）
      - name: Unit tests
        run: mvn -f backend/meowflow/pom.xml test -q

      # 集成测试 —— 需要真实 PG / Redis
      - name: Integration tests
        run: mvn -f backend/meowflow/pom.xml verify -Pintegration -Dtest='*IntegrationTest' -DfailIfNoTests=false -q

      # 生成 JaCoCo 报告
      - name: Generate JaCoCo coverage
        run: mvn -f backend/meowflow/pom.xml jacoco:report -q

      # 上传报告 artifact
      - name: Upload JaCoCo HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/meowflow/**/target/site/jacoco/index.html

      - name: Upload JaCoCo XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-xml
          path: backend/meowflow/**/target/site/jacoco/jacoco.xml

      # 上传 surefire 报告
      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/meowflow/**/target/surefire-reports/

      # 上传到 Codecov（可选，token 在 repo secrets）
      - name: Upload to Codecov
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: backend/meowflow/**/target/site/jacoco/jacoco.xml
          flags: backend
          name: meowflow-backend
        continue-on-error: true

      # 默认不跑 E2E —— 通过 workflow_dispatch 手动开启
      - name: E2E tests (opt-in)
        if: github.event_name == 'workflow_dispatch'
        run: mvn -f backend/meowflow/pom.xml verify -Pe2e -DfailIfNoTests=false -q
        continue-on-error: true