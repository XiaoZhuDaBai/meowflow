name: CI

# 修复说明（原 test.yml / test-coverage.yml 均无法运行）：
#  1. 原 workflow 在仓库根目录执行 `mvn`，但根目录没有 pom.xml ——
#     真实 Maven 工程在 backend/meowflow/，命令必然以 "no POM in this directory" 失败。
#  2. 原 workflow 只给 PG 配了 test/test，但 surefire 默认激活 Spring profile
#     `integration`，它解析的是 POSTGRES_* / REDIS_* 变量，默认库名 meowflow。
#     变量缺失时会去连 meowflow/meowflow123，与 service 容器凭据不符 → 连接失败。
#  3. `-Pintegration` / `-Pe2e` 这两个 Maven profile 根本不存在（pom 里只有
#     jacoco-gate / jacoco-gate-strict）→ "Could not find the selected project/profile"。
#  4. 覆盖率门禁读取 target/site/jacoco/jacoco.xml，且用 grep 提取
#     "Line coverage" —— jacoco.xml 里不存在该字符串，path 也不对。
#  5. `if: ${{ secrets.X != '' }}` 非法：secrets 上下文不能用于 step 级 if。
#  6. Codecov v4 缺 token 会硬失败；`mvn jacoco:report` 在根目录同样没有 pom。

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  JAVA_VERSION: '17'
  NODE_VERSION: '20'

jobs:
  # ============================================================
  # 后端：单元测试 + 集成测试（需要 PostgreSQL / Redis）
  # 所有测试以 Spring profile `integration` 运行（surefire 已默认激活），
  # 默认连接 jdbc:postgresql://localhost:5432/meowflow。
  # ============================================================
  backend:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: meowflow
          POSTGRES_PASSWORD: meowflow123
          POSTGRES_DB: meowflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      # 先只编译，快速暴露编译/依赖问题
      - name: Build
        working-directory: backend/meowflow
        run: mvn -B clean install -DskipTests

      # 测试连接参数与 service 容器保持一致。
      # 表结构由 Flyway 自动建立（meowflow-common/src/main/resources/db/migration，
      # 由 common-defaults.yml 的 spring.flyway 配置启用），无需手工建表。
      - name: Run tests
        working-directory: backend/meowflow
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: '5432'
          POSTGRES_DB: meowflow
          POSTGRES_USER: meowflow
          POSTGRES_PASSWORD: meowflow123
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          NACOS_ENABLED: 'false'
          NACOS_CONFIG_ENABLED: 'false'
        run: mvn -B test

      - name: Generate JaCoCo reports
        if: always()
        working-directory: backend/meowflow
        run: mvn -B jacoco:report

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/meowflow/**/target/surefire-reports/
          if-no-files-found: warn

      - name: Upload JaCoCo coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: backend/meowflow/**/target/site/jacoco/
          if-no-files-found: warn

  # ============================================================
  # 前端：类型检查 + 单元测试 + 生产构建
  # ============================================================
  frontend:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/meowflow-ui/package-lock.json

      - name: Install dependencies
        working-directory: frontend/meowflow-ui
        run: npm ci

      - name: Type check
        working-directory: frontend/meowflow-ui
        run: npx vue-tsc --noEmit

      - name: Unit tests
        working-directory: frontend/meowflow-ui
        run: npm run test

      - name: Build
        working-directory: frontend/meowflow-ui
        run: npx vite build

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/meowflow-ui/dist/
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # 打包：确认可产出可运行 jar
  # ============================================================
  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [backend, frontend]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin
          cache: maven

      - name: Package
        working-directory: backend/meowflow
        run: mvn -B clean package -DskipTests

      - name: Upload JAR artifacts
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifacts
          path: backend/meowflow/**/target/*.jar
          retention-days: 7
          if-no-files-found: warn

  # ============================================================
  # 覆盖率门禁（可选）：启用它需要仓库 Settings → Secrets 配置 CODECOV_TOKEN
  # 并用 if: github.event_name == 'push' 之类的事件条件控制，
  # 不要写 `if: ${{ secrets.X != '' }}`（secrets 上下文在 step 级 if 中不可用）。
  # 项目内已内置更可靠的门禁：mvn verify -Pjacoco-gate（LINE 65% / BRANCH 50%）。
  # ============================================================
