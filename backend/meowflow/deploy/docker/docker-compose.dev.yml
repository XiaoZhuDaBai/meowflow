# Volumes
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  minio_data:
    driver: local
  nacos_data:
    driver: local
  nacos_logs:
    driver: local

# Network
networks:
  meowflow-network:
    driver: bridge

