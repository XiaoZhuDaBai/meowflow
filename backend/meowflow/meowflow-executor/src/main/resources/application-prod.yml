# 生产环境配置
spring:
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 20
        concurrency: 4
        max-concurrency: 10

# 生产环境执行器配置
meowflow:
  mq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    prefetch: 20
  executor:
    distributed-mode: true

logging:
  level:
    com.meowflow.executor.mq: INFO
