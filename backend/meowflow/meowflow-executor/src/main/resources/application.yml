server:
  port: 8083

spring:
  application:
    name: meowflow-executor
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  config:
    import: optional:classpath:common-defaults.yml
  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/meowflow}
    username: ${DB_USER:meowflow}
    password: ${DB_PASSWORD:meowflow123}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  # Nacos 服务发现 + 配置中心
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_ENABLED:false}
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        weight: 100
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_HOST:localhost}:${NACOS_PORT:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: ${NACOS_GROUP:DEFAULT_GROUP}
        file-extension: yml
        refresh-enabled: true
        import-check:
          enabled: false

  # RabbitMQ 配置
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        acknowledge-mode: manual
        prefetch: 10
        concurrency: 2
        max-concurrency: 5
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          multiplier: 2.0
    publisher-confirm-type: correlated
    publisher-returns: true

# MeowFlow MQ 配置
meowflow:
  mq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USER:guest}
    password: ${RABBITMQ_PASSWORD:guest}
    virtual-host: ${RABBITMQ_VHOST:/}
    prefetch: 10
    max-retries: 3
    initial-retry-interval: 1000
    retry-multiplier: 2.0

  # 执行器配置
  executor:
    # 分布式模式开关 (true: 使用 RabbitMQ, false: 使用本地队列)
    distributed-mode: ${EXECUTOR_DISTRIBUTED_MODE:false}
    # 本地队列配置
    queue:
      capacity: 1000
      poll-timeout-ms: 1000
    # 心跳配置
    heartbeat:
      interval-seconds: 30
      timeout-seconds: 90
    # 任务执行配置
    task:
      default-timeout-ms: 300000
      default-max-retries: 3
      cleanup-interval-seconds: 300
  thread-pool:
    task-execution:
          core-size: 10
          max-size: 20
          queue-capacity: 500
  monitor:
    enabled: ${MONITOR_ENABLED:true}
        # 通过 Nacos 服务发现，无需配置 URL

# 线程池配置

# Feign 配置
feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
        loggerLevel: basic
  circuitbreaker:
    enabled: true
  httpclient:
    enabled: true

# 监控配置

# 日志配置
logging:
  level:
    root: INFO
    com.meowflow: DEBUG
    com.meowflow.executor.mq: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] [%X{traceId}] %-5level %logger{36} - %msg%n"
