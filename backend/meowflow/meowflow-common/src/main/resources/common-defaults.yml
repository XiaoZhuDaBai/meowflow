spring:
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 0
    validate-on-migrate: true
    clean-disabled: true

# ==========================================
# Actuator 健康检查配置
# 所有服务都需要支持 /actuator/health 用于 Docker 健康检查
# ==========================================
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

# ==========================================
# 通用配置（所有模块共享）
# ==========================================
# AES 加密密钥
# 开发环境默认值，生产环境必须通过环境变量 MEOWFLOW_CRYPTO_AES_KEY 或 Nacos 覆盖
meowflow:
  crypto:
    aes-key: ${MEOWFLOW_CRYPTO_AES_KEY:m3dLu8JrJ22Jr0PJbM215/N/I4KOfjmNqzhHmJGav80=}
    key-id: dev-local
